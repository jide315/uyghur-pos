[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uyghur-pos"
version = "0.1.0"
description = "Reproducible Uyghur POS tagging and CPU deployment experiments"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.3,<2.6", "numpy>=1.26,<2"]

[project.optional-dependencies]
baseline = ["stanza==1.10.1"]
test = ["pytest==8.3.5"]

[project.scripts]
uyghur-pos = "uyghur_pos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
