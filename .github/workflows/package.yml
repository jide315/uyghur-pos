name: Test and build Python packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU runtime and test dependencies
        run: |
          python -m pip install torch==2.3.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pytest==8.3.5 build
          python -m pip install --no-deps .
      - name: Test without external datasets or GPU
        run: python -m pytest -q
      - name: Build installable packages
        run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
